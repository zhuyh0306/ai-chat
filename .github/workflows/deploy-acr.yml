name: Build & Push to ACR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 0. 校验 Secret 是否配置
      # --------------------------------------------------
      - name: Validate Secrets
        run: |
          missing=""
          if [ -z "${{ secrets.ACR_REGISTRY }}" ]; then
            missing="$missing ACR_REGISTRY"
          fi
          if [ -z "${{ secrets.ACR_NAMESPACE }}" ]; then
            missing="$missing ACR_NAMESPACE"
          fi
          if [ -z "${{ secrets.ACR_USERNAME }}" ]; then
            missing="$missing ACR_USERNAME"
          fi
          if [ -z "${{ secrets.ACR_PASSWORD }}" ]; then
            missing="$missing ACR_PASSWORD"
          fi
          if [ -n "$missing" ]; then
            echo "❌ 缺少 GitHub Secret(s):$missing"
            echo ""
            echo "请在 GitHub 仓库 → Settings → Secrets and variables → Actions 中添加："
            echo "  ACR_REGISTRY  = registry.cn-hangzhou.aliyuncs.com"
            echo "  ACR_NAMESPACE = 你的命名空间名"
            echo "  ACR_USERNAME  = 阿里云账号/子账号"
            echo "  ACR_PASSWORD  = ACR 固定密码"
            exit 1
          fi
          echo "✅ 所有 Secret 已配置"

      # --------------------------------------------------
      # 1. 登录阿里云 ACR
      # --------------------------------------------------
      - name: Login to Alibaba Cloud ACR
        uses: aliyun/acr-login@v1
        with:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          USERNAME: ${{ secrets.ACR_USERNAME }}
          PASSWORD: ${{ secrets.ACR_PASSWORD }}

      # --------------------------------------------------
      # 2. 缓存 Node.js 基础镜像到 ACR（首次拉取后后续直接用 ACR）
      #    使用 sed 解决 BusyBox wget 对 HTTPS 的兼容问题
      # --------------------------------------------------
      - name: Cache Node base image to ACR
        run: |
          set -e

          ACR_BASE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/node:22-alpine"

          # 先检查 ACR 中是否已有该镜像
          if docker manifest inspect "$ACR_BASE" > /dev/null 2>&1; then
            echo "✅ Node 基础镜像已存在于 ACR，跳过拉取"
            exit 0
          fi

          echo "⏳ ACR 中无缓存，从公开源拉取 node:22-alpine ..."

          pull_from() {
            docker pull "$1" 2>/dev/null && return 0
            return 1
          }

          # 依次尝试多个源
          for src in \
            "node:22-alpine" \
            "docker.io/library/node:22-alpine" \
            "registry-1.docker.io/library/node:22-alpine" \
            "mirror.gcr.io/library/node:22-alpine"; do
            echo "  → 尝试: $src"
            if pull_from "$src"; then
              echo "✅ 拉取成功: $src"
              docker tag "$src" "$ACR_BASE"
              docker push "$ACR_BASE"
              echo "✅ 已缓存到 ACR: $ACR_BASE"
              exit 0
            fi
            echo "  ⚠ 失败，尝试下一个源..."
          done

          echo "❌ 所有公开源均拉取失败"
          echo "请在你本地执行以下命令手动推送一次基础镜像到 ACR："
          echo ""
          echo "  docker pull node:22-alpine"
          echo "  docker tag node:22-alpine $ACR_BASE"
          echo "  docker login --username=你的阿里云账号 ${{ secrets.ACR_REGISTRY }}"
          echo "  docker push $ACR_BASE"
          exit 1

      # --------------------------------------------------
      # 3. 构建 Docker 镜像 & 推送到 ACR
      # --------------------------------------------------
      - name: Build and Push App Image
        run: |
          set -e

          ACR_BASE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/node:22-alpine"
          FULL_IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/my-app"

          docker build \
            --build-arg BASE_IMAGE="$ACR_BASE" \
            --build-arg MASTRA_API_URL="${{ secrets.MASTRA_API_URL }}" \
            --build-arg MASTRA_AGENT_ID="${{ secrets.MASTRA_AGENT_ID }}" \
            -t "$FULL_IMAGE:${{ github.sha }}" \
            -t "$FULL_IMAGE:latest" \
            .

          docker push "$FULL_IMAGE:${{ github.sha }}"
          docker push "$FULL_IMAGE:latest"

          echo "✅ 推送成功: $FULL_IMAGE"
