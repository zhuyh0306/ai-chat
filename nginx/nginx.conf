server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # 静态文档 gzip 压缩（fullstack-companion 等 46MB 纯文本 HTML 压缩后约 5MB）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/html text/css application/javascript application/json image/svg+xml font/ttf font/otf application/font-woff application/font-woff2;

    # 手动上传的静态文档（如 fullstack-companion，体积大不进 git/镜像）
    # 由 nginx 直接 serve，同源访问，iframe / 字体均无需 CORS
    # 用 rewrite 替代 alias+try_files，规避 alias 拼路径的已知坑
    location ^~ /docs/ {
        root /usr/share/nginx;
        rewrite ^/docs/(.*)$ /static-docs/$1 break;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 后端 API：所有 /api/* 转发到 NestJS（容器网络内地址）
    location /api/ {
        proxy_pass http://nest-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger UI（由 nest-server 提供，挂在 /api/docs）：透传文档与静态资源，无需额外开放端口
    location /api/docs {
        proxy_pass http://nest-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 文档为静态资源，关闭缓冲避免加载异常
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Mastra 代理：原 /api/chat、/api/agents 已迁移到 /mastra 前缀（由 Next.js 提供）
    location /mastra/ {
        proxy_pass http://my-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式响应需关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 前端（Next.js）：其余所有请求
    location / {
        proxy_pass http://my-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
