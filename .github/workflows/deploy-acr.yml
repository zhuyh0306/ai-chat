name: Build & Push to ACR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-push.outputs.image }}
      version_tag: ${{ steps.build-push.outputs.version_tag }}
      latest_tag: ${{ steps.build-push.outputs.latest_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 0. 校验 Secret
      # --------------------------------------------------
      - name: Validate Secrets
        run: |
          missing=""
          if [ -z "${{ secrets.ACR_REGISTRY }}" ]; then
            missing="$missing ACR_REGISTRY"
          fi
          if [ -z "${{ secrets.ACR_NAMESPACE }}" ]; then
            missing="$missing ACR_NAMESPACE"
          fi
          if [ -z "${{ secrets.ACR_USERNAME }}" ]; then
            missing="$missing ACR_USERNAME"
          fi
          if [ -z "${{ secrets.ACR_PASSWORD }}" ]; then
            missing="$missing ACR_PASSWORD"
          fi
          if [ -n "$missing" ]; then
            echo "❌ 缺少 GitHub Secret(s):$missing"
            echo ""
            echo "请在 GitHub 仓库 → Settings → Secrets and variables → Actions 中添加对应 Secret"
            exit 1
          fi
          echo "✅ 所有 Secret 已配置"

      # --------------------------------------------------
      # 1. 登录阿里云 ACR（原生 docker login，确保 push 权限）
      # --------------------------------------------------
      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            --username="${{ secrets.ACR_USERNAME }}" \
            --password-stdin \
            "${{ secrets.ACR_REGISTRY }}"
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled

      # --------------------------------------------------
      # 2. 缓存 Node.js 基础镜像到 ACR（失败时回退到公开镜像）
      # --------------------------------------------------
      - name: Cache Node base image to ACR
        id: cache-node
        run: |
          set +e

          ACR_BASE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/node:22-alpine"
          PUBLIC_BASE="node:22-alpine"

          # 用 docker pull 检查 ACR 中是否已有缓存（比 manifest inspect 更可靠）
          if docker pull "$ACR_BASE" > /dev/null 2>&1; then
            echo "✅ Node 基础镜像已存在于 ACR"
            echo "base_image=$ACR_BASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "⏳ ACR 中无缓存，从公开源拉取 node:22-alpine ..."

          for src in \
            "node:22-alpine" \
            "docker.io/library/node:22-alpine" \
            "registry-1.docker.io/library/node:22-alpine"; do
            echo "  → 尝试: $src"
            if docker pull "$src" 2>/dev/null; then
              echo "✅ 拉取成功: $src"
              docker tag "$src" "$ACR_BASE"
              if docker push "$ACR_BASE" 2>/dev/null; then
                echo "✅ 已缓存到 ACR: $ACR_BASE"
                echo "base_image=$ACR_BASE" >> "$GITHUB_OUTPUT"
              else
                echo "⚠️ 推送到 ACR 被拒绝（权限不足），将回退使用公开镜像: $PUBLIC_BASE"
                echo "base_image=$PUBLIC_BASE" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            echo "  ⚠ 失败，尝试下一个..."
          done

          echo "❌ 所有公开源均拉取失败"
          exit 1

      # --------------------------------------------------
      # 3. 构建 & 推送应用镜像到 ACR
      # --------------------------------------------------
      - name: Build and Push App Image
        id: build-push
        run: |
          set -e

          BASE_IMAGE="${{ steps.cache-node.outputs.base_image }}"
          FULL_IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/my-app"
          VERSION_TAG="$FULL_IMAGE:${{ github.sha }}"
          LATEST_TAG="$FULL_IMAGE:latest"

          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg MASTRA_API_URL="${{ secrets.MASTRA_API_URL }}" \
            --build-arg MASTRA_AGENT_ID="${{ secrets.MASTRA_AGENT_ID }}" \
            -t "$VERSION_TAG" \
            -t "$LATEST_TAG" \
            .

          docker push "$VERSION_TAG"
          docker push "$LATEST_TAG"

          echo "image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          echo "✅ 推送成功: $FULL_IMAGE"
          echo "   版本标签: $VERSION_TAG"
          echo "   最新标签: $LATEST_TAG"

      - name: Summary
        run: |
          echo "## 📦 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **镜像仓库**: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/my-app" >> "$GITHUB_STEP_SUMMARY"
          echo "- **版本标签**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **最新标签**: \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "服务器部署建议：" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/my-app:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
