name: Build & Push to ACR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ================================================================
  # Job 1: 构建镜像 & 推送到阿里云 ACR
  # ================================================================
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-push.outputs.image }}
      version_tag: ${{ steps.build-push.outputs.version_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Secrets
        run: |
          missing=""
          for s in ACR_REGISTRY ACR_NAMESPACE ACR_USERNAME ACR_PASSWORD; do
            if [ -z "$(printenv $s)" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "❌ 缺少 GitHub Secret(s):$missing"
            echo "请到 Settings → Secrets and variables → Actions 中添加"
            exit 1
          fi
          echo "✅ ACR Secret 已配置"
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Alibaba Cloud ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            --username="${{ secrets.ACR_USERNAME }}" \
            --password-stdin \
            "${{ secrets.ACR_REGISTRY }}"

      - name: Cache Node base image to ACR
        id: cache-node
        run: |
          set +e

          ACR_BASE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/node:22-alpine"
          PUBLIC_BASE="node:22-alpine"

          if docker pull "$ACR_BASE" > /dev/null 2>&1; then
            echo "✅ Node 基础镜像已存在于 ACR"
            echo "base_image=$ACR_BASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "⏳ ACR 中无缓存，从公开源拉取 node:22-alpine ..."

          for src in \
            "node:22-alpine" \
            "docker.io/library/node:22-alpine" \
            "registry-1.docker.io/library/node:22-alpine"; do
            echo "  → 尝试: $src"
            if docker pull "$src" 2>/dev/null; then
              echo "✅ 拉取成功: $src"
              docker tag "$src" "$ACR_BASE"
              if docker push "$ACR_BASE" 2>/dev/null; then
                echo "✅ 缓存到 ACR: $ACR_BASE"
                echo "base_image=$ACR_BASE" >> "$GITHUB_OUTPUT"
              else
                echo "⚠️ 推送到 ACR 被拒，回退公开镜像: $PUBLIC_BASE"
                echo "base_image=$PUBLIC_BASE" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            echo "  ⚠ 失败，尝试下一个..."
          done

          echo "❌ 所有源均拉取失败"
          exit 1

      - name: Build and Push App Image
        id: build-push
        run: |
          set -e

          BASE_IMAGE="${{ steps.cache-node.outputs.base_image }}"
          FULL_IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/my-app"
          VERSION_TAG="$FULL_IMAGE:${{ github.sha }}"
          LATEST_TAG="$FULL_IMAGE:latest"

          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg MASTRA_API_URL="${{ secrets.MASTRA_API_URL }}" \
            --build-arg MASTRA_AGENT_ID="${{ secrets.MASTRA_AGENT_ID }}" \
            -t "$VERSION_TAG" \
            -t "$LATEST_TAG" \
            .

          docker push "$VERSION_TAG"
          docker push "$LATEST_TAG"

          echo "image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

          echo "✅ 推送成功: $FULL_IMAGE"

  # ================================================================
  # Job 2: SSH 到阿里云 ECS，拉取镜像并重启服务
  # ================================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Validate Deploy Secrets
        run: |
          missing=""
          for s in SERVER_HOST SERVER_USER SERVER_SSH_KEY ACR_NAMESPACE; do
            if [ -z "$(printenv $s)" ]; then missing="$missing $s"; fi
          done
          if [ -n "$missing" ]; then
            echo "⚠️ 缺少部署 Secret(s):$missing，跳过自动部署"
            echo "请到 Settings → Secrets and variables → Actions 添加："
            echo "  SERVER_HOST    = 你的 ECS 公网 IP"
            echo "  SERVER_USER    = 服务器用户名（如 root）"
            echo "  SERVER_SSH_KEY = SSH 私钥（~/.ssh/id_rsa 内容）"
            exit 1
          fi
          echo "✅ 部署 Secret 已配置"
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # ---- 配置区 ----
            ACR_REGISTRY="${{ secrets.ACR_REGISTRY }}"
            ACR_NAMESPACE="${{ secrets.ACR_NAMESPACE }}"
            ACR_USERNAME="${{ secrets.ACR_USERNAME }}"
            ACR_PASSWORD="${{ secrets.ACR_PASSWORD }}"
            IMAGE="$ACR_REGISTRY/$ACR_NAMESPACE/my-app"
            VERSION="${{ needs.build-and-push.outputs.version_tag }}"

            echo "🚀 开始部署..."
            echo "   镜像: $IMAGE"
            echo "   版本: $VERSION"

            # 1. 登录 ACR
            echo "📦 登录 ACR ..."
            echo "$ACR_PASSWORD" | docker login \
              --username="$ACR_USERNAME" \
              --password-stdin \
              "$ACR_REGISTRY"

            # 2. 拉取最新镜像
            echo "⬇️  拉取镜像 ..."
            docker pull "$IMAGE:latest"

            # 3. 重启服务（如果 docker-compose.yml 不在服务器上，需要先上传）
            if [ -f docker-compose.yml ]; then
              echo "🔄 重启服务 ..."
              IMAGE="$IMAGE:latest" docker compose up -d --remove-orphans
            else
              echo "🔄 重启容器（docker compose 方式） ..."
              docker stop my-app 2>/dev/null || true
              docker rm my-app 2>/dev/null || true
              docker run -d \
                --name my-app \
                --restart=unless-stopped \
                -p 3000:3000 \
                -e NODE_ENV=production \
                -e PORT=3000 \
                -e MASTRA_API_URL="${{ secrets.MASTRA_API_URL }}" \
                -e MASTRA_AGENT_ID="${{ secrets.MASTRA_AGENT_ID }}" \
                "$IMAGE:latest"
            fi

            # 4. 清理悬空镜像
            echo "🧹 清理旧镜像 ..."
            docker image prune -f

            # 5. 验证
            echo ""
            echo "✅ 部署完成！等待 5 秒检查健康状态..."
            sleep 5
            docker ps --filter "name=my-app" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
