server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # 后端 API：所有 /api/* 转发到 NestJS（容器网络内地址）
    location /api/ {
        proxy_pass http://nest-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger UI（由 nest-server 提供，挂在 /api/docs）：透传文档与静态资源，无需额外开放端口
    location /api/docs {
        proxy_pass http://nest-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 文档为静态资源，关闭缓冲避免加载异常
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Mastra 代理：原 /api/chat、/api/agents 已迁移到 /mastra 前缀（由 Next.js 提供）
    location /mastra/ {
        proxy_pass http://my-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式响应需关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 前端（Next.js）：其余所有请求
    location / {
        proxy_pass http://my-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
