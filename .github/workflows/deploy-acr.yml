name: Build & Push to ACR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 0. 校验 Secret 是否配置
      # --------------------------------------------------
      - name: Validate Secrets
        run: |
          missing=""
          if [ -z "${{ secrets.ACR_REGISTRY }}" ]; then
            missing="$missing ACR_REGISTRY"
          fi
          if [ -z "${{ secrets.ACR_NAMESPACE }}" ]; then
            missing="$missing ACR_NAMESPACE"
          fi
          if [ -z "${{ secrets.ACR_USERNAME }}" ]; then
            missing="$missing ACR_USERNAME"
          fi
          if [ -z "${{ secrets.ACR_PASSWORD }}" ]; then
            missing="$missing ACR_PASSWORD"
          fi
          if [ -n "$missing" ]; then
            echo "❌ 缺少 GitHub Secret(s):$missing"
            echo ""
            echo "请在 GitHub 仓库 → Settings → Secrets and variables → Actions 中添加："
            echo "  ACR_REGISTRY  = registry.cn-hangzhou.aliyuncs.com"
            echo "  ACR_NAMESPACE = 你的命名空间名"
            echo "  ACR_USERNAME  = 阿里云账号/子账号"
            echo "  ACR_PASSWORD  = ACR 固定密码"
            echo ""
            echo "详情参考阿里云容器镜像服务 → 访问凭证"
            exit 1
          fi
          echo "✅ 所有 Secret 已配置"

      # --------------------------------------------------
      # 1. 登录阿里云容器镜像服务
      # --------------------------------------------------
      - name: Login to Alibaba Cloud ACR
        uses: aliyun/acr-login@v1
        with:
          REGISTRY: ${{ secrets.ACR_REGISTRY }}
          USERNAME: ${{ secrets.ACR_USERNAME }}
          PASSWORD: ${{ secrets.ACR_PASSWORD }}

      # --------------------------------------------------
      # 2. 构建 Docker 镜像 & 推送到 ACR
      # --------------------------------------------------
      - name: Build and Push Docker Image
        run: |
          FULL_IMAGE=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/my-app

          docker build \
            --build-arg MASTRA_API_URL=${{ secrets.MASTRA_API_URL }} \
            --build-arg MASTRA_AGENT_ID=${{ secrets.MASTRA_AGENT_ID }} \
            -t $FULL_IMAGE:${{ github.sha }} \
            -t $FULL_IMAGE:latest \
            .

          docker push $FULL_IMAGE:${{ github.sha }}
          docker push $FULL_IMAGE:latest

          echo "✅ 推送成功: $FULL_IMAGE"
